# Not applied by kustomize / ArgoCD. Copy this, fill in a real generated
# password, and `kubectl apply -f` it manually once per cluster. Never commit
# the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
type: Opaque
stringData:
  POSTGRES_USER: bambuddy
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: bambuddy
  DATABASE_URL: "postgresql+asyncpg://bambuddy:CHANGE_ME@bambuddy-postgres:5432/bambuddy"
