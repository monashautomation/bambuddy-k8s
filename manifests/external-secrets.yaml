apiVersion: v1
kind: ServiceAccount
metadata:
  name: bambuddy-eso
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bambuddy-vault
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "bambuddy"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "bambuddy"
          serviceAccountRef:
            name: bambuddy-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bambuddy-postgres
spec:
  secretStoreRef:
    name: bambuddy-vault
    kind: SecretStore
  target:
    name: bambuddy-postgres
  refreshInterval: 1h
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: postgres
        property: POSTGRES_DB
    - secretKey: DATABASE_URL
      remoteRef:
        key: postgres
        property: DATABASE_URL
