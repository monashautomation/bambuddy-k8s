apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy
  namespace: bambuddy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bambuddy
  template:
    metadata:
      labels:
        app: bambuddy
    spec:
      # SSDP printer discovery needs L2 multicast -> host networking,
      # same trade-off as network_mode: host in the upstream compose file.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # host-networked pod binds directly to this node's ports, pin it.
      # Moved from pop-4 (kubelet down, node cordoned) to pop-5 2026-08-02.
      # Postgres NetworkPolicy ipBlock and postgres nodeSelector must move
      # together -- see postgres.yaml.
      nodeSelector:
        kubernetes.io/hostname: pop-5
      containers:
        - name: bambuddy
          image: ghcr.io/maziggy/bambuddy:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            # image entrypoint starts as root to chown /app/data and /app/logs
            # to PUID:PGID, then drops to that user via gosu before running.
            # App binary is setcap'd cap_net_bind_service unconditionally (for
            # optional privileged VP ports), so exec fails with EPERM unless
            # NET_BIND_SERVICE is in our bounding set -- even though this
            # deployment only binds port 8000. allowPrivilegeEscalation must
            # stay true (default) so the kernel honors that file capability;
            # setting it false (no_new_privs) blocks setcap'd exec entirely.
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID", "NET_BIND_SERVICE"]
          lifecycle:
            # Image ships without git, but bambuddy's web UI self-updater shells
            # out to it ("Could not find git executable"). Installed here on
            # every start since it's not baked into the upstream image and pod
            # restarts otherwise wipe it. Version pinned (Debian trixie) so a
            # repo update can't silently change what gets installed.
            postStart:
              exec:
                command: ["sh", "-c", "apt-get update -qq && apt-get install -y -qq --no-install-recommends git=1:2.47.3-0+deb13u1"]
          env:
            - name: TZ
              value: "Australia/Melbourne"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8000"
            # SQLite over the NFS-backed data PVC caused chronic lock contention
            # and QueuePool exhaustion (503s, stuck login) once moved off local
            # VM disk. Postgres avoids the NFS+WAL locking problem entirely.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bambuddy-postgres
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bambuddy-data
        - name: logs
          persistentVolumeClaim:
            claimName: bambuddy-logs
