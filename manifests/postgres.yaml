# bambuddy-postgres Secret (POSTGRES_USER/PASSWORD/DB/DATABASE_URL) is
# synced from OpenBao via ExternalSecret (external-secrets.yaml), not defined
# here. See postgres-secret.example.yaml for the expected shape.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bambuddy-postgres-data
  namespace: bambuddy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bambuddy-postgres
  template:
    metadata:
      labels:
        app: bambuddy-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: pop-5
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-perms
          image: postgres:16-alpine
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: bambuddy-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # synchronous_commit=off: PGDATA lives on nfs-client (NFS-backed
          # PVC), where every WAL fsync round-trips over the network
          # (~100ms/write observed). With sync commit on, frequent small
          # writes (e.g. AMS sensor history every 5s) each blocked on that
          # fsync, causing app-wide "slow API" symptom. Trades a few hundred
          # ms of commit durability on hard crash/power loss for eliminating
          # that stall; pod restarts are unaffected (WAL replay still
          # happens).
          #
          # NOTE: a local-storage migration was attempted (hostPath on pop-4)
          # to avoid this tradeoff entirely, but pop-4 (Talos) does not
          # persist arbitrary paths under /var across node maintenance --
          # the data directory was wiped, causing a full outage + data loss
          # back to the last pg_dump. Do not retry local hostPath storage on
          # this node without a Talos-sanctioned persistent mount
          # (e.g. /var/mnt) and real validation that it survives a reboot.
          # nfs-client is the reliable choice here.
          args: ["-c", "synchronous_commit=off"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bambuddy"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bambuddy-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
spec:
  selector:
    app: bambuddy-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
spec:
  podSelector:
    matchLabels:
      app: bambuddy-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # bambuddy app pod runs with hostNetwork: true (needed for SSDP printer
    # discovery), so its traffic arrives from the node IP, not a pod-CIDR
    # address -- podSelector alone won't match it, hence the ipBlock. This
    # ipBlock is only valid while the app stays pinned to pop-5
    # (nodeSelector in deployment.yaml) -- update both together.
    # Moved from pop-4 (172.28.14.1) to pop-5 2026-08-02.
    - from:
        - podSelector:
            matchLabels:
              app: bambuddy
        - ipBlock:
            cidr: 172.28.15.1/32
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Postgres itself never needs to initiate outbound connections beyond
    # DNS -- deny everything else to limit blast radius if the container
    # is ever compromised.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
