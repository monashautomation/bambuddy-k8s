apiVersion: v1
kind: Secret
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
type: Opaque
stringData:
  POSTGRES_USER: bambuddy
  POSTGRES_PASSWORD: "9SZ4Q5fjJEUDN2LrHEsj2vhlZWuSq5"
  POSTGRES_DB: bambuddy
  DATABASE_URL: "postgresql+asyncpg://bambuddy:9SZ4Q5fjJEUDN2LrHEsj2vhlZWuSq5@bambuddy-postgres:5432/bambuddy"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bambuddy-postgres-data
  namespace: bambuddy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bambuddy-postgres
  template:
    metadata:
      labels:
        app: bambuddy-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-perms
          image: postgres:16-alpine
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: bambuddy-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bambuddy"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bambuddy-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: bambuddy-postgres
  namespace: bambuddy
spec:
  selector:
    app: bambuddy-postgres
  ports:
    - port: 5432
      targetPort: 5432
